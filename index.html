<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <!-- 🧠 為什麼這樣設計
      你可以這樣講：
      👉 SEO：
      使用 description 提供搜尋摘要
      OG tags 提供社群分享預覽
      👉 字體：
      中文：Noto Sans TC（可讀性）
      英文：Playfair（品牌感）
      👉 結構：
      保持極簡，將 UI 完全交給 React 控制
      index 僅負責 SEO 與入口
      💡 小優化（你之後可以做）
      🔹 1. OG 圖統一品牌
      👉 建議：
      植物 + 留白背景
      Logo + slogan
      🔹 2. favicon 統一
      👉 建議：
      小盆栽 icon
      或葉子
      🔹 3. theme-color
      你可以之後改：
      #2f6d4f（你的主綠色） -->

    <!-- favicon（之後放 public/favicon.jpg） -->
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />

    <!-- RWD -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>植間生活 | Between Green</title>
    <meta
      name="description"
      content="專注於植物 × 空間 × 生活風格，打造書桌陪伴、空間造景與日常植培的療癒生活體驗。"
    />
    <meta name="keywords" content="植物, 植栽, 室內設計, 空間造景, 陽台種植, 植物送禮" />

    <!-- Open Graph（社群分享） -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="植間生活 | Between Green" />
    <meta property="og:description" content="讓空間長出生活感，從書桌到陽台的植感設計。" />
    <meta property="og:image" content="https://your-domain.com/og-image.jpg" />
    <!-- ⚠️ 之後放一張品牌圖（1200x630） -->

    <!-- Google Fonts（乾淨日系感） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- 中文 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- 英文（品牌用） -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Color（手機瀏覽器顏色） -->
    <meta name="theme-color" content="#f5f3ef" />

    <!-- 假設圖片 preload（可刪） -->
    <!-- <link rel="preload" as="image" href="/hero.jpg" /> -->
  </head>

  <body>
    <!-- 🟢 React 掛載點 -->
    <div id="root"></div>

    <!-- 🧩 可選：Loading 初始畫面（可之後刪） -->
    <div id="initial-loader">
      <!-- 這邊可以放一個簡單 loading -->
      <!-- 例如：logo + fade -->
    </div>

    <!-- ⚛️ React 入口 -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
